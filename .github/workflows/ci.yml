name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Run tests
        run: bun run test 2>&1
      
      - name: Build check
        run: bun build src/index.ts --outdir /tmp/nole-build --target node --no-banner 2>&1

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Type check
        run: bun run typecheck 2>&1

  bundle-size:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Build
        run: |
          bun build src/index.ts --outdir /tmp/nole-build --target node --no-banner
          SIZE=$(du -sh /tmp/nole-build/index.js | cut -f1)
          echo "Bundle size: $SIZE"
          # Warn if over 2MB
          if [ -f /tmp/nole-build/index.js ]; then
            BYTES=$(stat -c%s /tmp/nole-build/index.js)
            if [ "$BYTES" -gt 2097152 ]; then
              echo "::warning::Bundle size ${SIZE} exceeds 2MB threshold"
            fi
          fi

