<svg xmlns="http://www.w3.org/2000/svg" width="800" height="680" viewBox="0 0 800 680">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 13px; }
      .bg { fill: #1a1b26; }
      .title-bar { fill: #24283b; }
      .dot-red { fill: #f7768e; }
      .dot-yellow { fill: #e0af68; }
      .dot-green { fill: #9ece6a; }
      .white { fill: #c0caf5; }
      .dim { fill: #565f89; }
      .cyan { fill: #7dcfff; }
      .pink { fill: #ff69b4; }
      .green { fill: #9ece6a; }
      .yellow { fill: #e0af68; }
      .red { fill: #f7768e; }
      .magenta { fill: #bb9af7; }
      .bold { font-weight: 700; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="680" rx="10"/>

  <!-- Title bar -->
  <rect class="title-bar" width="800" height="36" rx="10 10 0 0"/>
  <circle class="dot-red" cx="20" cy="18" r="6"/>
  <circle class="dot-yellow" cx="40" cy="18" r="6"/>
  <circle class="dot-green" cx="60" cy="18" r="6"/>
  <text class="dim" x="350" y="22" text-anchor="middle">nole — tim@vps</text>

  <!-- Banner -->
  <text class="cyan bold" x="20" y="62">▐▛███▜▌</text>
  <text class="white bold" x="100" y="62">Nole Code v1.19</text>
  <text class="dim" x="250" y="62">· MiniMax</text>
  <text class="dim" x="20" y="78">▝▜█████▛▘</text>
  <text class="dim" x="100" y="78">~/my-project</text>

  <!-- Divider -->
  <text class="dim" x="20" y="98">────────────────────────────────────────────────────────────</text>

  <!-- User input -->
  <text class="dim" x="20" y="120">❯</text>
  <text class="white" x="36" y="120">refactor auth.ts to use JWT instead of sessions</text>

  <!-- Spinner -->
  <text class="pink" x="20" y="148">⠹</text>
  <text class="pink" x="36" y="148">Milking the API...</text>
  <text class="dim" x="210" y="148">(2s)</text>

  <!-- Assistant response -->
  <text class="magenta" x="20" y="176">🤖 nole │</text>
  <text class="white" x="110" y="176">I'll refactor the auth middleware. Let me read it first.</text>

  <!-- Tool calls -->
  <text class="cyan" x="20" y="204">⟳</text>
  <text class="white bold" x="36" y="204">Read</text>
  <text class="dim" x="76" y="204">(src/middleware/auth.ts)</text>
  <text class="green" x="20" y="222">✅</text>
  <text class="white" x="36" y="222">Read</text>
  <text class="dim" x="76" y="222">[3ms]</text>

  <text class="dim" x="36" y="244">  1  import { sessions } from '../store'</text>
  <text class="dim" x="36" y="260">  2  export function auth(req, res, next) {</text>
  <text class="dim" x="36" y="276">  3    const token = req.headers.authorization</text>
  <text class="dim" x="36" y="292">  4    const user = sessions.get(token)</text>

  <!-- Edit tool -->
  <text class="cyan" x="20" y="320">⟳</text>
  <text class="white bold" x="36" y="320">Edit</text>
  <text class="dim" x="76" y="320">(src/middleware/auth.ts)</text>
  <text class="green" x="20" y="338">✅</text>
  <text class="white" x="36" y="338">Edit</text>
  <text class="dim" x="76" y="338">[1ms]</text>

  <text class="red" x="36" y="360">- import { sessions } from '../store'</text>
  <text class="green" x="36" y="376">+ import jwt from 'jsonwebtoken'</text>
  <text class="red" x="36" y="396">- const user = sessions.get(token)</text>
  <text class="green" x="36" y="412">+ const user = jwt.verify(token, process.env.JWT_SECRET)</text>

  <!-- Bash tool -->
  <text class="cyan" x="20" y="440">⟳</text>
  <text class="white bold" x="36" y="440">Bash</text>
  <text class="dim" x="76" y="440">(npm install jsonwebtoken @types/jsonwebtoken)</text>
  <text class="green" x="20" y="458">✅</text>
  <text class="white" x="36" y="458">Bash</text>
  <text class="dim" x="76" y="458">[1.2s]</text>

  <!-- RunTests -->
  <text class="cyan" x="20" y="486">⟳</text>
  <text class="white bold" x="36" y="486">Bash</text>
  <text class="dim" x="76" y="486">(npm test)</text>
  <text class="green" x="20" y="504">✅</text>
  <text class="white" x="36" y="504">Bash</text>
  <text class="dim" x="76" y="504">[3.4s]</text>
  <text class="green" x="36" y="522">12 passing (2s)</text>

  <!-- Summary -->
  <text class="white" x="20" y="554">Refactored auth.ts from session-based to JWT. Installed</text>
  <text class="white" x="20" y="570">jsonwebtoken. All 12 tests pass.</text>

  <!-- Footer -->
  <text class="dim" x="20" y="600">────────────────────────────────────────────────────────────</text>
  <text class="dim" x="20" y="620">4.8s · ~2400 tokens (2%) · 4 turns</text>

  <!-- Next prompt -->
  <text class="dim" x="20" y="650">❯</text>
  <rect class="pink" x="36" y="640" width="8" height="14" opacity="0.7"/>
</svg>
